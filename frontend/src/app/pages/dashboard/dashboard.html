<div class="dashboard">
  <div class="header">
    <h1>Meine Gruppen</h1>
    <button mat-fab color="primary" (click)="openCreateGroup()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  @if (groups.length === 0) {
    <mat-card class="empty-state">
      <mat-card-content>
        <mat-icon class="empty-icon">group</mat-icon>
        <p>Noch keine Gruppen. Erstelle deine erste Gruppe!</p>
      </mat-card-content>
    </mat-card>
  }

  <div class="group-list">
    @for (group of groups; track group.id) {
      <mat-card class="group-card" (click)="openGroup(group)">
        <mat-card-header>
          <mat-card-title>{{ group.name }}</mat-card-title>
          <mat-card-subtitle>{{ group.description }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <mat-chip-set>
            <mat-chip>
              <mat-icon matChipAvatar>group</mat-icon>
              {{ getMemberCount(group) }} Mitglieder
            </mat-chip>
          </mat-chip-set>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
